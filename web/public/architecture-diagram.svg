<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">How Asset Register works</title><desc id="desc">Three parts: a website, a server and a database. Department records enter through a read-only link to the server. A second person approves additions and changes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#517365" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="560" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#233934">
<text x="40" y="44" font-size="24" font-weight="bold">One register. Three parts.</text>
<text x="40" y="75" font-size="15" fill="#6c7c71">An internal tool for viewers, editors, reviewers and admins</text>
<g stroke="#b8cbc0" fill="#f2f7f1"><rect x="40" y="125" width="270" height="170" rx="12"/><rect x="405" y="125" width="270" height="170" rx="12"/><rect x="770" y="125" width="270" height="170" rx="12"/></g>
<g font-size="23" font-weight="bold"><text x="65" y="165">Website</text><text x="430" y="165">Server</text><text x="795" y="165">Database</text></g>
<g font-size="13" fill="#6c7c71"><text x="65" y="190">Vercel</text><text x="430" y="190">Render</text><text x="795" y="190">Render</text></g>
<g font-size="16"><text x="65" y="230">Map, lists and review screens</text><text x="65" y="256">Shows the person's area</text><text x="430" y="230">Checks access and files</text><text x="430" y="256">Applies approved changes</text><text x="795" y="225">Assets, contracts and photos</text><text x="795" y="251">Protected history</text></g>
<g stroke="#517365" stroke-width="2" marker-end="url(#arrow)"><path d="M312 207 H400"/><path d="M677 207 H765"/></g>
<g font-size="11" fill="#517365" text-anchor="middle"><text x="356" y="182">Secure requests</text><text x="723" y="182">Read and save</text></g>
<rect x="405" y="355" width="270" height="96" rx="10" stroke="#8ca497" stroke-width="1.5" stroke-dasharray="7 5" fill="#fff"/>
<text x="430" y="390" font-size="20" font-weight="bold">Department systems</text><text x="430" y="421" font-size="15">Keep the official records</text>
<path d="M540 352 V300" stroke="#517365" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="558" y="328" font-size="12" fill="#517365">File or web address · read only</text>
<g font-size="14" fill="#50675b"><text x="40" y="494">The website shows records; the server checks requests; the database keeps records and history.</text><text x="40" y="517">Departments stay the official source. The register never edits their records.</text><text x="40" y="540">Additions and changes wait for a second person's approval.</text></g>
</g></svg>
