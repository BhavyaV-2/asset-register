<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" role="img" aria-labelledby="title">
<title id="title">How a change enters the register</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#517365" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="490" fill="white"/><g font-family="Arial,sans-serif" fill="#233934"><text x="40" y="44" font-size="24" font-weight="bold">A person decides what changes.</text>
<g fill="#f2f7f1" stroke="#b8cbc0"><rect x="40" y="90" width="270" height="95" rx="10"/><rect x="405" y="90" width="270" height="95" rx="10"/><rect x="770" y="90" width="270" height="95" rx="10"/><rect x="405" y="255" width="270" height="80" rx="10"/><rect x="770" y="255" width="270" height="80" rx="10"/><rect x="770" y="375" width="270" height="80" rx="10"/></g>
<g font-size="17"><text x="65" y="125">Department file</text><text x="65" y="153">or web address</text><text x="430" y="125">Read, check and compare</text><text x="430" y="153">each row</text><text x="795" y="125">Request waits for review</text><text x="795" y="153">New, changed, match or missing</text><text x="430" y="288">If unchanged:</text><text x="430" y="314">record the check date</text><text x="795" y="288">Approve: update the register</text><text x="795" y="314">and save history</text><text x="795" y="408">Reject: save the reason</text><text x="795" y="434">and keep the record unchanged</text></g>
<g stroke="#517365" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M312 137 H400"/><path d="M677 137 H765"/><path d="M540 187 V250"/><path d="M905 187 V250"/><path d="M1042 137 H1060 V415 H1045"/></g><text x="738" y="223" font-size="14" fill="#517365">A different person decides</text><text x="40" y="425" font-size="15" fill="#50675b">The person who made the request</text><text x="40" y="450" font-size="15" fill="#50675b">cannot approve it.</text></g></svg>
