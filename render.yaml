databases:
  - name: asset-register-db
    databaseName: asset_register
    postgresMajorVersion: "16"
    plan: free
    ipAllowList: []
services:
  - type: web
    name: asset-register-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asset-register-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SHOW_DEMO_SIGN_INS
        value: "true"
      - key: PHOTO_STORAGE
        value: database
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: LOAD_SAMPLE_DATA
        value: "true"
