services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: asset_register
      POSTGRES_USER: asset_register
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - asset_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_register -d asset_register"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  asset_data:
